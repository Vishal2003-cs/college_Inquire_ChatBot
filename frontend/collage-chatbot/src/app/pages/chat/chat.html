<div class="chat-page">
  <div class="container">
    <!-- Chat Header -->
    <div class="chat-header text-center">
      <div class="header-top">
        <div class="bot-icon">🎓</div>
        <div>
          <h1>AI College Assistant</h1>
          <div class="status">
            <span class="status-dot"></span>
            Online
          </div>
        </div>
      </div>
      <p>Ask anything about our college — admissions, courses, fees & more</p>
    </div>

    <!-- Chat Box -->
    <div class="chat-box shadow">

      <!-- Empty state -->
      <div class="empty-state" *ngIf="message.length === 0 && !isTyping">
        <div class="empty-icon">💬</div>
        <p>Start a conversation with your AI Assistant</p>
      </div>

      <div
        class="message"
        *ngFor="let msg of message"
        [ngClass]="msg.sender">

        <!-- Sender label -->
        <div class="sender-label">
          {{ msg.sender === 'user' ? 'You' : 'AI Assistant' }}
        </div>

        <div class="message-row" [ngClass]="msg.sender">
          <div class="avatar">
            <span *ngIf="msg.sender === 'AI'">🤖</span>
            <span *ngIf="msg.sender === 'user'">👤</span>
          </div>
          <div class="bubble">
            {{ msg.text }}
          </div>
        </div>
      </div>

      <!-- AI typing indicator -->
      <div class="message AI" *ngIf="isTyping">
        <div class="sender-label">AI Assistant</div>
        <div class="message-row AI">
          <div class="avatar">🤖</div>
          <div class="bubble typing-bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

    </div>

    <!-- Input Area -->
    <div class="input-area">
      <input
        type="text"
        class="form-control"
        placeholder="Type your question here..."
        [(ngModel)]="User_text"
        (keydown.enter)="send_text()"
      >
      <button
        class="btn btn-primary send-btn"
        (click)="send_text()"
        [disabled]="!User_text.trim()">
        <span>➤</span>
      </button>
    </div>
  </div>
</div>
