
<div class="chat-page">

  <div class="container">

    <!----Chat Header----->
    <div class="chat-header text-center">
     <h1><i class="bi bi-robot"></i> AI College Assistant</h1>
      <div class = "status">
          🟢 Online
      </div>
      <p>
        Ask anything about our college
      </p>
    </div>


    <!-----Chat Box---->
    <div class="chat-box shadow">
        <!---Vishal data binding-->
        <div
            class ="message"
            *ngFor ="let msg of message"
            [ngClass] ="msg.sender">
              
              <div class ="avatar">
              <span *ngIf="msg.sender === 'AI'"><i class="bi bi-robot"></i></span>
              <span *ngIf="msg.sender === 'user'"><i class="bi bi-person-circle"></i></span>
              </div>

              <div class ="bubble">
             
                {{msg.text}}
              </div>
            
        </div>
        <!-----Ai typing------>
        <div class ="message AI"
             *ngIf = "isTyping">
              <div class ="avatar">
                <i class="bi bi-robot"></i>
              </div>
              <div class ="bubble">
                AI is Typing...
              </div>
        </div>

      <!-- Bot Message 
      <div class="message bot">
        <div class="bubble">
          Hello 👋  
          I am your AI College Assistant.
          How can I help you today?
        </div>
      </div>


       User Message 
      <div class="message user">
        <div class="bubble">
          Tell me about Software Engineering.
        </div>
      </div>


       Bot Reply 
      <div class="message bot">
        <div class="bubble">
          Software Engineering is a degree program
          focused on designing and developing software systems.
        </div>
      </div>-->


    </div>


    <!-----Input Area------>
    <div class="input-area">
    <!--vishal data binding-->
      <input 
        type="text"
        class="form-control"
        placeholder="Type question Here...."
        [(ngModel)]="User_text"
        (keydown.enter)="send_text()"
      >


      <button class="btn btn-primary" (click)="send_text()">
        <i class="bi bi-send-fill"></i> Send
      </button>

    </div>


  </div>

</div>
